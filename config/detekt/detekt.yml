complexity:
  # S: eine schwer lesbare Methode tut meist mehr als eine Sache - ergaenzt
  # CyclomaticComplexMethod (zaehlt Pfade, nicht Verschachtelung).
  CognitiveComplexMethod:
    active: true
  # I: eine breite Schnittstelle zwingt jede Implementierung (ein Backend, ein
  # Authentifizierungsadapter, ...) zu Mitgliedern, die sie nicht braucht.
  ComplexInterface:
    active: true

exceptions:
  # L: eine Ueberschreibung, die NotImplementedError/TODO() wirft, ersetzt ihren Obertyp nicht.
  NotImplementedDeclaration:
    active: true

style:
  # D: Importrichtung der Schichten. Quelle ist die Tabelle in spec/architecture.md Abschnitt 2
  # (Spalte Package): was dort unter "Darf importieren" nicht steht, ist hier verboten.
  # runtime ist der Composition Root und hat keine Regel.
  # Der Kern (domain, port) ist eine Erlaubnisliste: alles ist verboten ausser den Imports unter
  # allowedImports, also auch jede Fremdbibliothek. Daneben sperrt je eine Regel `<package>-technik`
  # Technik, die unter den erlaubten Globs liegt (Threads, Dateisystem, Prozess, Reflection,
  # Logging). Die uebrigen Schichten sind Verbotslisten ueber die Packages des Projekts; sie duerfen
  # Fremdbibliotheken nutzen. Die Kernregeln gelten ueber `includes` fuer Main- und Test-Quellsatz:
  # auch ein Test im Kern importiert nur, was die Erlaubnisliste nennt (kotlin.test statt JUnit).
  # `make detekt-selbsttest` prueft die Regeln: aus den Werten hier erzeugt
  # tools/detekt-selbsttest.sh je Regel verbotene Imports, die alle gemeldet werden muessen; die
  # handgeschriebenen Dateien unter config/detekt/selbsttest/ nennen je Package die erlaubten
  # Imports (Allowed.kt, melden nichts) und fuer den Kern Fremdbibliotheken (Fremd.kt, melden
  # alles). Fuer jede Verbotsliste muessen verbotene, erlaubte und das eigene Package zusammen
  # alle Packages der Testdaten ergeben, fuer jede Erlaubnisliste die erlaubten Projekt-Packages
  # genau die Imports von Allowed.kt plus das eigene Package; ein fehlender oder zusaetzlicher Wert
  # faellt so auf. Die Package-Verzeichnisse der Testdaten sind die Packages der Architekturtabelle.
  # Grenzen: ForbiddenImport liest nur import-Zeilen, ein voll qualifizierter Name im Code
  # umgeht die Regel. Schnittstelle und Implementierung von transport und observability sind
  # noch kein Package-Schnitt: protocol darf daher alles ausser simulation und runtime
  # importieren, auch die Transport-Implementierung, die die Architektur ihm verbietet.
  ForbiddenImport/domain:
    active: true
    includes: ['**/io/github/pt9912/tdswire/domain/**']
    forbiddenImports:
      - value: '*'
        reason: 'domain kennt nur die Standardbibliothek ohne Netzwerk, keine Fremdbibliothek und kein anderes Package.'
    allowedImports:
      - 'kotlin.*'
      - 'java.lang.*'
      - 'java.util.*'
      - 'java.time.*'
      - 'java.math.*'
      - 'io.github.pt9912.tdswire.domain.*'
  ForbiddenImport/domain-technik:
    active: true
    includes: ['**/io/github/pt9912/tdswire/domain/**']
    forbiddenImports:
      - value: 'java.lang.Runtime'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern.'
      - value: 'java.lang.ProcessBuilder'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern.'
      - value: 'java.lang.ProcessHandle'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern.'
      - value: 'java.lang.reflect.*'
        reason: 'Reflection: der Kern ist ein reines Modell ohne Laufzeit-Introspektion.'
      - value: 'java.util.concurrent.*'
        reason: 'Threads: Nebenlaeufigkeit liegt im Transport, im Kern gibt es nur Werte.'
      - value: 'java.util.logging.*'
        reason: 'Logging: Telemetrie liegt in observability, nicht im Kern.'
      - value: 'java.util.zip.*'
        reason: 'Technik: Kompression liegt nicht im Kern.'
      - value: 'kotlin.concurrent.*'
        reason: 'Threads: Nebenlaeufigkeit liegt im Transport, im Kern gibt es nur Werte.'
      - value: 'kotlin.io.*'
        reason: 'Dateisystem und Konsole: Ein- und Ausgabe liegt ausserhalb des Kerns.'
      - value: 'kotlin.system.*'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern.'
  ForbiddenImport/port:
    active: true
    includes: ['**/io/github/pt9912/tdswire/port/**']
    forbiddenImports:
      - value: '*'
        reason: 'port kennt domain, die Standardbibliothek und die Laufzeitbibliothek fuer asynchrone Streams, sonst nichts.'
    allowedImports:
      - 'kotlin.*'
      - 'kotlinx.coroutines.*'
      - 'java.lang.*'
      - 'java.util.*'
      - 'java.time.*'
      - 'java.math.*'
      - 'io.github.pt9912.tdswire.domain.*'
      - 'io.github.pt9912.tdswire.port.*'
  ForbiddenImport/port-technik:
    active: true
    includes: ['**/io/github/pt9912/tdswire/port/**']
    forbiddenImports:
      - value: 'java.lang.Runtime'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Port.'
      - value: 'java.lang.ProcessBuilder'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Port.'
      - value: 'java.lang.ProcessHandle'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Port.'
      - value: 'java.lang.reflect.*'
        reason: 'Reflection: der Port ist ein Vertrag ohne Laufzeit-Introspektion.'
      - value: 'java.util.concurrent.*'
        reason: 'Threads: die Nebenlaeufigkeit des Ports ist die der Laufzeitbibliothek fuer Streams.'
      - value: 'java.util.logging.*'
        reason: 'Logging: Telemetrie liegt in observability, nicht im Port.'
      - value: 'java.util.zip.*'
        reason: 'Technik: Kompression liegt nicht im Port.'
      - value: 'kotlin.concurrent.*'
        reason: 'Threads: die Nebenlaeufigkeit des Ports ist die der Laufzeitbibliothek fuer Streams.'
      - value: 'kotlin.io.*'
        reason: 'Dateisystem und Konsole: Ein- und Ausgabe liegt ausserhalb des Ports.'
      - value: 'kotlin.system.*'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Port.'
      - value: 'kotlinx.coroutines.reactive.*'
        reason: 'Fremdtechnik: eine Brueckenbibliothek zu Reactive Streams gehoert in einen Adapter.'
      - value: 'kotlinx.coroutines.reactor.*'
        reason: 'Fremdtechnik: eine Brueckenbibliothek zu Reactor gehoert in einen Adapter.'
      - value: 'kotlinx.coroutines.rx2.*'
        reason: 'Fremdtechnik: eine Brueckenbibliothek zu RxJava gehoert in einen Adapter.'
      - value: 'kotlinx.coroutines.rx3.*'
        reason: 'Fremdtechnik: eine Brueckenbibliothek zu RxJava gehoert in einen Adapter.'
      - value: 'kotlinx.coroutines.slf4j.*'
        reason: 'Logging: Telemetrie liegt in observability, nicht im Port.'
  ForbiddenImport/config:
    active: true
    includes: ['**/io/github/pt9912/tdswire/config/**']
    forbiddenImports:
      - value: 'io.github.pt9912.tdswire.port.*'
        reason: 'config darf nur domain importieren.'
      - value: 'io.github.pt9912.tdswire.protocol.*'
        reason: 'config darf nur domain importieren.'
      - value: 'io.github.pt9912.tdswire.transport.*'
        reason: 'config darf nur domain importieren.'
      - value: 'io.github.pt9912.tdswire.observability.*'
        reason: 'config darf nur domain importieren.'
      - value: 'io.github.pt9912.tdswire.simulation.*'
        reason: 'config darf nur domain importieren.'
      - value: 'io.github.pt9912.tdswire.runtime.*'
        reason: 'config darf nur domain importieren.'
  ForbiddenImport/protocol:
    active: true
    includes: ['**/io/github/pt9912/tdswire/protocol/**']
    forbiddenImports:
      - value: 'io.github.pt9912.tdswire.simulation.*'
        reason: 'der Protokollkern laeuft ohne das Simulations-Backend.'
      - value: 'io.github.pt9912.tdswire.runtime.*'
        reason: 'runtime ist der Composition Root - protocol darf ihn nicht kennen.'
  ForbiddenImport/transport:
    active: true
    includes: ['**/io/github/pt9912/tdswire/transport/**']
    forbiddenImports:
      - value: 'io.github.pt9912.tdswire.port.*'
        reason: 'transport kennt keine Backend-Engine und keinen Backend-Port.'
      - value: 'io.github.pt9912.tdswire.simulation.*'
        reason: 'transport kennt keine Backend-Engine.'
      - value: 'io.github.pt9912.tdswire.runtime.*'
        reason: 'runtime ist der Composition Root - transport darf ihn nicht kennen.'
  ForbiddenImport/observability:
    active: true
    includes: ['**/io/github/pt9912/tdswire/observability/**']
    forbiddenImports:
      - value: 'io.github.pt9912.tdswire.config.*'
        reason: 'observability darf nur domain importieren und trifft keine fachlichen Entscheidungen.'
      - value: 'io.github.pt9912.tdswire.port.*'
        reason: 'observability darf nur domain importieren und trifft keine fachlichen Entscheidungen.'
      - value: 'io.github.pt9912.tdswire.protocol.*'
        reason: 'observability darf nur domain importieren und trifft keine fachlichen Entscheidungen.'
      - value: 'io.github.pt9912.tdswire.transport.*'
        reason: 'observability darf nur domain importieren und trifft keine fachlichen Entscheidungen.'
      - value: 'io.github.pt9912.tdswire.simulation.*'
        reason: 'observability darf nur domain importieren und trifft keine fachlichen Entscheidungen.'
      - value: 'io.github.pt9912.tdswire.runtime.*'
        reason: 'observability darf nur domain importieren und trifft keine fachlichen Entscheidungen.'
  ForbiddenImport/simulation:
    active: true
    includes: ['**/io/github/pt9912/tdswire/simulation/**']
    forbiddenImports:
      - value: 'io.github.pt9912.tdswire.config.*'
        reason: 'simulation darf nur domain und port importieren.'
      - value: 'io.github.pt9912.tdswire.protocol.*'
        reason: 'ein Backend-Adapter kennt keine TDS-Paketbytes.'
      - value: 'io.github.pt9912.tdswire.transport.*'
        reason: 'ein Backend-Adapter kennt keinen Transport.'
      - value: 'io.github.pt9912.tdswire.observability.*'
        reason: 'simulation darf nur domain und port importieren.'
      - value: 'io.github.pt9912.tdswire.runtime.*'
        reason: 'runtime ist der Composition Root - simulation darf ihn nicht kennen.'
  # Aufrufe im Kern, die keinen Import brauchen (java.lang) und die ForbiddenImport darum nicht
  # sieht. ForbiddenMethodCall wirkt nur mit Typaufloesung: im Gate laufen detektMain und
  # detektTest, das normale detekt meldet hier nichts. Die Liste ersetzt die Standardliste des
  # Pins (dort ist die Regel inaktiv). Eine Verbotsliste: ein hier nicht genannter Aufruf bleibt
  # gruen. `make detekt-selbsttest` fuehrt je Eintrag einen Rot-Fall in den Beispielen unter
  # config/detekt/selbsttest-aufrufe/.
  ForbiddenMethodCall:
    active: true
    includes:
      - '**/io/github/pt9912/tdswire/domain/**'
      - '**/io/github/pt9912/tdswire/port/**'
    methods:
      - value: 'java.lang.System.exit'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern.'
      - value: 'kotlin.system.exitProcess'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern.'
      - value: 'java.lang.Runtime.getRuntime'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern (exec, halt, addShutdownHook).'
      - value: 'java.lang.Runtime.exec'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern.'
      - value: 'java.lang.ProcessBuilder.<init>'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern.'
      - value: 'java.lang.ProcessHandle.current'
        reason: 'Prozess: Start und Ende des Dienstes gehoeren der Composition Root, nicht dem Kern.'
