  BlockCommentInitialStarAlignment: { active: true }
  ChainMethodContinuation: { active: false }
  ChainWrapping: { active: true }
  ClassName: { active: false }
  ClassSignature: { active: true }
  CommentSpacing: { active: true }
  CommentWrapping: { active: true }
  ConditionWrapping: { active: true }
  ContextReceiverListWrapping: { active: true }
  ContextReceiverMapping: { active: true }
  EnumEntryNameCase: { active: true }
  EnumWrapping: { active: true }
  ExpressionOperandWrapping: { active: false }
  Filename: { active: true }
  FinalNewline: { active: true }
  FunKeywordSpacing: { active: true }
  FunctionExpressionBody: { active: true }
  FunctionLiteral: { active: true }
