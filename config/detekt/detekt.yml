  ParameterListWrapping: { active: true }
  ParameterWrapping: { active: true }
  PropertyName: { active: true }
  PropertyWrapping: { active: true }
  SpacingAroundAngleBrackets: { active: true }
  SpacingAroundColon: { active: true }
  SpacingAroundComma: { active: true }
  SpacingAroundCurly: { active: true }
  SpacingAroundDot: { active: true }
  SpacingAroundDoubleColon: { active: true }
  SpacingAroundKeyword: { active: true }
  SpacingAroundOperators: { active: true }
