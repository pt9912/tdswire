  FunctionReturnTypeSpacing: { active: true }
  FunctionSignature: { active: true }
  FunctionStartOfBodySpacing: { active: true }
  FunctionTypeModifierSpacing: { active: true }
  FunctionTypeReferenceSpacing: { active: true }
  IfElseBracing: { active: false }
  IfElseWrapping: { active: false }
  ImportOrdering: { active: true }
  Indentation: { active: true }
  Kdoc: { active: true }
  KdocWrapping: { active: true }
  MaximumLineLength: { active: true }
  MixedConditionOperators: { active: true }
  ModifierListSpacing: { active: true }
  ModifierOrdering: { active: true }
  MultiLineIfElse: { active: true }
  MultilineExpressionWrapping: { active: false }
  MultilineLoop: { active: true }
  NoBlankLineBeforeRbrace: { active: true }
  NoBlankLineInList: { active: false }
  NoBlankLinesInChainedMethodCalls: { active: true }
  NoConsecutiveBlankLines: { active: true }
  NoConsecutiveComments: { active: false }
  NoEmptyClassBody: { active: true }
  NoEmptyFile: { active: true }
  NoEmptyFirstLineInClassBody: { active: false }
  NoEmptyFirstLineInMethodBlock: { active: true }
  NoLineBreakAfterElse: { active: true }
  NoLineBreakBeforeAssignment: { active: true }
  NoMultipleSpaces: { active: true }
