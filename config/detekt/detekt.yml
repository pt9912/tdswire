# detekt-Konfiguration. Sie baut auf der Standardkonfiguration der gepinnten Version auf
# (buildUponDefaultConfig, Pin in gradle/libs.versions.toml) und senkt keinen Standard: kein
# `active: false` auf einer Standardregel, keine laxere Schwelle, kein Pfad-Ausschluss. Eine
# Ausnahme steht nur hier, mit Begruendung am Eintrag, und braucht eine ADR (dauerhaft) oder einen
# Carveout mit Trigger (befristet, AGENTS.md 3.6). Es gibt keine Baseline und keine
# Inline-Unterdrueckung (AGENTS.md 3.2): @Suppress und @SuppressWarnings im Quelltext bricht
# tools/suppression-check.sh in der Stage `detekt`.
# detekt kann die SOLID-Prinzipien nicht selbst pruefen, nur Stellvertreter: Groesse und
# Komplexitaet fuer S (Single Responsibility), Schnittstellenbreite fuer I (Interface Segregation),
# Paketabhaengigkeiten fuer D (Dependency Inversion), fehlende Implementierungen fuer L (Liskov).

config:
  # Gemessen (alpha.6, ADR-0010): rot macht die Konfigurationsvalidierung (`validation`, Standard) einen
  # umbenannten oder unbekannten Schluessel; nicht erfasst sind Optionen von `ForbiddenImport/<name>` und der
  # Block `ktlint:`.
  warningsAsErrors: true

# Format: der ktlint-Regelsatz des Wrappers (detektPlugins in build.gradle.kts, Version wie das
# Plugin). Im Gate wird geprueft, nichts umgeschrieben. Jede Regel steht einzeln mit
# ausdruecklichem `active`; die Werte sind gleich dem Standard der gepinnten Version
# (config/config.yml im Jar detekt-rules-ktlint-wrapper), die dort inaktiven bleiben inaktiv. Nach
# einem Pin-Wechsel gehoert der Block neu aus dieser Datei erzeugt.
