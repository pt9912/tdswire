schema_format: "1.0"
name: manuell
version: "1"
tables:
  kunden:
    columns:
      Id:
        type: biginteger
        required: true
      Name:
        type: text
        max_length: 100
      Eintritt:
        type: date
    primary_key: [Id]
  bestellungen:
    columns:
      Id:
        type: biginteger
        required: true
      KundenId:
        type: biginteger
        required: true
      Betrag:
        type: decimal
        precision: 10
        scale: 2
    primary_key: [Id]
