# Jede Abhaengigkeits- und Plugin-Version steht hier; build.gradle.kts verweist als libs.* darauf.
# Die aufgeloesten Versionen sind in gradle.lockfile festgehalten, ihre Pruefsummen in
# gradle/verification-metadata.xml.

[versions]
kotlin = "2.4.10"
detekt = "2.0.0-alpha.6"
junit = "5.13.4"
coroutines = "1.10.1"

[libraries]
# Der ktlint-Regelsatz fuer detekt; seine Version ist die des Plugins.
detekt-ktlint = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }

# Laufzeit des Transports (ADR-0003): suspendierendes Lesen und Schreiben ueber den Kanal.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# Testlaufzeit: kotlin.test ueber die JUnit-Plattform; die Tests selbst importieren nur kotlin.test.
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
