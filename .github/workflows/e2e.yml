# CI fuehrt den E2E-Durchgang `make e2e` in Docker aus, getrennt von `make gates` (TDS-QA-01, TDS-QA-06,
# ADR-0022). Der Runner liefert Docker, GNU make und bash. Die Stufen stehen in tools/e2e.sh, die Liste der Gates
# in harness/README.md §Sensors, nicht hier.
name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

# Der Lauf liest nur; es gibt keine Secrets und kein Schreibrecht auf das Repo.
permissions:
  contents: read

jobs:
  e2e:
    # Das Label `ubuntu-24.04` statt `ubuntu-latest`: ein Wechsel der Hauptversion ist eine Aenderung
    # dieser Datei. Das Image dahinter rollt fort; Docker- und make-Version sind nicht festgelegt.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v6.1.0, per Commit festgelegt wie in gates.yml; Zugangsdaten bleiben nicht im Klon.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: make e2e
        run: make e2e
