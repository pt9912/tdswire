# Veroeffentlichung der Bibliothek in GitHub Packages und Cloudsmith bei Tag-Push `v*` (TDS-RB-05, TDS-QA-06, ADR-0048,
# ADR-0049). Kein Gate: `make publish` und `make publish-cloudsmith` stehen in keiner Gate-Liste, der Workflow ist kein
# Eingang von `make gates` (ADR-0048 Entscheidung 3). Rang-Zeiger: Ablauf und Tag-Schutz in docs/maintainer/releasing.md,
# Werkzeug-Zeilen in harness/README.md §Sensors.
# Zwei Jobs veroeffentlichen, `publish` (GitHub Packages) und `publish-cloudsmith` (Cloudsmith); beide haengen an
# `gates`, keiner an dem anderen, keiner hat `continue-on-error` (ADR-0049 Entscheidung 2a). Ein roter Job wird allein
# wiederholt. `packages: write` steht nur in `publish`; die Werte von Cloudsmith stehen nur im `env:` des Schritts
# `make publish-cloudsmith` (ADR-0049 Entscheidung 3a).
# Kopplung: Job `gates` wiederholt Checkout und Aufruf aus .github/workflows/gates.yml; aendert sich dort einer
# von beiden, wird er hier nachgezogen.
# Grenzen: `make workflow-lint` prueft Syntax und Ausdruecke, nicht die SHA-Pins und nicht die Reihenfolge `gates` vor
# beiden Veroeffentlichungs-Jobs, nicht die Bedingung und nicht, welcher Job welches Secret und welche Rechte hat;
# das prueft der Review. Der Dispatch-Lauf baut die Stage `publish` ohne Token und ohne Netz zu GitHub Packages oder
# Cloudsmith und fuehrt den Job `publish-cloudsmith` nach seiner Bedingung nicht aus (gelesen, nicht gemessen); das Schreiben mit GITHUB_TOKEN belegt der Tag-Lauf
# 43699125460, das Schreiben nach Cloudsmith erst die erste echte Veroeffentlichung dorthin.
name: veroeffentlichung

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Rechte stehen je Job; der Kopf vergibt keine.
permissions: {}

# Je Ref eine Gruppe; ein laufender Lauf wird nie abgebrochen (`cancel-in-progress: false`). Ein zweiter Lauf desselben
# Tags wartet (gelesen, nicht gemessen). Grenze: nach der GitHub-Dokumentation (aus dem Gedaechtnis, nicht abgerufen) haelt
# die Gruppe hoechstens einen wartenden Lauf; ein dritter Lauf kann den wartenden zweiten verdraengen.
concurrency:
  group: veroeffentlichung-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0, per Commit festgelegt, wie in gates.yml.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: make gates
        run: make gates

  # Nur der Tag-Push veroeffentlicht; ein Dispatch auf einem Tag-Ref hat ref_type `tag`, aber event_name `workflow_dispatch`.
  publish:
    needs: gates
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      # Mit fetch-depth 0 liegt der Klon vollstaendig vor und enthaelt origin/main (gelesen, am Klon eines Tag-Push nicht
      # gemessen). Fehlt origin/main, bricht der Schritt vor dem Token. Quelle der Kontrolle: Tag-Schutz, siehe releasing.md.
      - name: Tag-Commit liegt in origin/main
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "veroeffentlichung: FEHLER - der Tag-Commit liegt nicht in origin/main" >&2; exit 1; }
      # GITHUB_ACTOR ist laut Dokumentation eine Standardvariable des Runners (gelesen, nicht gemessen); GITHUB_TOKEN steht nur hier im Schritt, kein Wert als Argument, kein --url.
      - name: make publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make publish

  # Nur der Tag-Push veroeffentlicht, dieselbe Bedingung wie `publish`. Kein `needs: publish`: ein Fehler eines Ziels haelt
  # das andere nicht zurueck. CLOUDSMITH_USERNAME und CLOUDSMITH_API_KEY sind Repository-Secrets und stehen nur im Schritt
  # `make publish-cloudsmith`; ohne `packages: write`.
  publish-cloudsmith:
    needs: gates
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag-Commit liegt in origin/main
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "veroeffentlichung: FEHLER - der Tag-Commit liegt nicht in origin/main" >&2; exit 1; }
      - name: make publish-cloudsmith
        env:
          CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: make publish-cloudsmith

  # Nur beim Dispatch: Bau der Stage `publish` und POM-Ausgabe, kein Token, nichts nach aussen.
  vorschau:
    needs: gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: make publish-vorschau
        run: make publish-vorschau
